server {
    listen 80;
    server_name fast-typing.be www.fast-typing.be;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fast-typing.be www.fast-typing.be;

    ssl_certificate     /etc/letsencrypt/live/fast-typing.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fast-typing.be/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Serve the React frontend (built files)
    root /home/mypersonaluser/typing-game/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Actix
    location /api/ {
        proxy_pass http://127.0.0.1:8080;  # internal, no TLS needed
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE — disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 24h;
    }
}
