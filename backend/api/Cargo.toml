[package]
name = "api"
version = "0.1.0"
edition = "2024"
authors = ["Samuel de Meester <samuel.dem22@gmail.com>"]

[[bin]]
name = "server-api"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4.13.0", features = ["rustls-0_23"] }
actix-web-lab = "0.26"
actix-cors = "0.7.1"
anyhow = "1.0.102"
bytes = "1"
dotenvy = "0.15.7"
futures-util = "0.3.32"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.5", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }

miniredis = { path = "../miniredis" }
