[workspace]
resolver = "3"
members = ["miniredis", "api"]

[workspace.package]
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
actix-web = "4.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
actix-web-lab = "0.26"
uuid = { version = "1.23.0", features = ["v4"] }
tokio = { version = "1.5", features = ["full"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
