services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # backend not directly expose outside
    volumes:
      - sqlite_data:/var/lib/typing-game
    environment:
      DATABASE_URL: sqlite:///var/lib/typing-game/scores.db?mode=rwc
      BIND_ADDR: 0.0.0.0:8080
      ALLOWED_ORIGIN: https://fast-typing.be
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite_data:
